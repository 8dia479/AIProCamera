# The CI/sandbox used for verification has ~2 GB RAM, so the daemon is kept small and
# Kotlin compiles in-process. Raise these values on a normal workstation.
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 enables built-in Kotlin by default, which forbids applying the org.jetbrains.kotlin.android
# plugin. This project keeps the explicit KGP (2.2.20) wiring, so built-in Kotlin is opted out.
android.builtInKotlin=false
# KGP 2.2.x still casts the android block to BaseExtension, which only exists with the legacy DSL.
android.newDsl=false
